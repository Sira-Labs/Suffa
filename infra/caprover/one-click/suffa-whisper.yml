# Suffa — CapRover one-click template: self-hosted transcription (Whisper on the CPU).
#
# speaches (https://github.com/speaches-ai/speaches) serves faster-whisper behind an
# OpenAI-compatible /v1/audio/transcriptions endpoint. It runs next to suffa-api and
# suffa-worker on the same server, is not exposed to the internet, and recordings never
# leave the server.
#
# Use: CapRover → Apps → One-Click Apps/Databases → ">> TEMPLATE <<" → paste this file →
#      app name "suffa" (creates the app "suffa-whisper") → Deploy.
# Then (docs/ops/caprover-deployment.md, "Transcription"): download the model once, set
# SUFFA_TRANSCRIBE_* on suffa-api and suffa-worker, and switch "KI für Transkripte" on in
# the class.
captainVersion: 4
services:
  $$cap_appname-whisper:
    image: ghcr.io/speaches-ai/speaches:$$cap_tag
    restart: always
    environment:
      API_KEY: $$cap_api_key
      ENABLE_UI: 'false'
      LOG_LEVEL: info
      # int8 halves memory and time on CPUs with little quality loss.
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: $$cap_threads
      # Unload the model after 10 idle minutes to give the memory back.
      STT_MODEL_TTL: '600'
    volumes:
      # Downloaded models survive restarts and updates.
      - $$cap_appname-whisper-models:/home/ubuntu/.cache/huggingface/hub
    caproverExtra:
      notExposeAsWebApp: 'true'

caproverOneClickApp:
  variables:
    - id: $$cap_tag
      label: Image tag (CPU build)
      defaultValue: 0.8.3-cpu
      validRegex: /^[A-Za-z0-9._-]+-cpu$/
    - id: $$cap_api_key
      label: API key
      defaultValue: $$cap_gen_random_hex(32)
      description: Set the same value as SUFFA_TRANSCRIBE_TOKEN on suffa-api and suffa-worker.
      validRegex: /^[A-Za-z0-9]{32,}$/
    - id: $$cap_threads
      label: CPU threads
      defaultValue: '4'
      description: Threads for one transcription; leave some for the other apps on the server.
      validRegex: /^[1-9][0-9]?$/
  instructions:
    start: Self-hosted Whisper transcription for Suffa (speaches, CPU). Recordings stay on this server.
    end: >-
      suffa-whisper is running (internal only). Next: download the model once and set
      SUFFA_TRANSCRIBE_URL, SUFFA_TRANSCRIBE_TOKEN and SUFFA_TRANSCRIBE_MODEL on suffa-api and
      suffa-worker, as described in docs/ops/caprover-deployment.md ("Transcription").
  displayName: Suffa Whisper (transcription)
  isOfficial: false
  description: Self-hosted speech-to-text (faster-whisper via speaches) for Suffa's recording transcripts.
  documentation: https://github.com/speaches-ai/speaches
