name: ci

on:
  pull_request:
  push:
    branches: [main, claude/ai-tutor-platform-spec-f7u0ar]
  # Called by release.yml so nothing is built or deployed unless these checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: web (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck -w @suffa/web
      - run: npm test -w @suffa/web
      - run: npm run test:tools
      - run: npm run build -w @suffa/web

  api:
    name: api (typecheck, unit + Postgres integration tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suffa
          POSTGRES_PASSWORD: ci0123456789abcdef
          POSTGRES_DB: suffa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suffa" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database: the integration tests wipe it.
      SUFFA_TEST_DATABASE_URL: postgres://suffa:ci0123456789abcdef@127.0.0.1:5432/suffa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @suffa/api
      - run: npm test -w @suffa/api
      - run: npm run build -w @suffa/api
