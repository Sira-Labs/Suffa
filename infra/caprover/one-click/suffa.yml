# Suffa — CapRover one-click template: web + db.
#
# Use: CapRover → Apps → One-Click Apps/Databases → ">> TEMPLATE <<" → paste this file →
#      app name "suffa" → Deploy.
# Creates: suffa-web (Caddy serving the offline PWA; public domain) and
#          suffa-db  (Postgres 17 + pgvector; internal only).
# Images are built by .github/workflows/release.yml and published publicly on GHCR.
# For api + worker as well, use suffa-full.yml instead. Runbook: docs/ops/caprover-deployment.md
captainVersion: 4
services:
  $$cap_appname-db:
    image: pgvector/pgvector:$$cap_pg_tag
    restart: always
    volumes:
      - $$cap_appname-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: suffa
      POSTGRES_DB: suffa
      POSTGRES_PASSWORD: $$cap_db_password
    caproverExtra:
      notExposeAsWebApp: 'true'

  $$cap_appname-web:
    image: ghcr.io/thedatadudech/suffa-web:$$cap_tag
    restart: always
    environment:
      # Until suffa-api exists, /api answers 502; the offline app is unaffected.
      SUFFA_API_UPSTREAM: srv-captain--$$cap_appname-api:8000
      SUFFA_MEDIA_UPSTREAM: srv-captain--$$cap_rustfs_app:9000
    caproverExtra:
      containerHttpPort: '80'

caproverOneClickApp:
  variables:
    - id: $$cap_tag
      label: Image tag
      defaultValue: latest
      description: latest follows main. For production use an immutable sha-<short> tag; CI redeploys with those.
      validRegex: /^[A-Za-z0-9._-]+$/
    - id: $$cap_pg_tag
      label: pgvector/Postgres image tag
      defaultValue: pg17
      description: Postgres 17 with pgvector. For production pin a release tag such as 0.8.0-pg17 and upgrade deliberately after a pg_dump.
      validRegex: /^[A-Za-z0-9._-]+$/
    - id: $$cap_db_password
      label: Database password
      defaultValue: $$cap_gen_random_hex(24)
      description: Generated. Hex is safe inside a database URL.
      validRegex: /^[A-Za-z0-9]{16,}$/
    - id: $$cap_rustfs_app
      label: Existing RustFS app name
      defaultValue: rustfs
      description: The shared RustFS app (also used by Tabayyun). Only used for /media once recordings ship.
      validRegex: /^[a-z0-9-]+$/
  instructions:
    start: >-
      Deploys Suffa (offline-first Arabic learning platform): the web app (Caddy + PWA) and
      its database (Postgres 17 + pgvector), in the same layout as Tabayyun. Use the app name
      "suffa" so the apps are called suffa-web and suffa-db.
    end: >-
      Done. Next: (1) $$cap_appname-web → HTTP Settings → connect your domain, Enable HTTPS,
      Force HTTPS. (2) Deployment tab → Enable App Token → store it as the GitHub secret
      CAPROVER_APP_TOKEN_WEB and set the repository variable
      CAPROVER_SERVER=https://captain.<root-domain>, so every push to main redeploys.
      (3) The database is internal at srv-captain--$$cap_appname-db:5432 (user and db
      "suffa"; the password is in the db app's environment variables).
  displayName: Suffa (web + db)
  isOfficial: false
  description: Offline-first Arabic learning platform (الصُّفَّة) — web app and database.
  documentation: https://github.com/thedatadudech/suffa/blob/main/docs/ops/caprover-deployment.md
