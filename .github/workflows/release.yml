name: release

# Builds the suffa-web image on every push to main, publishes it to GHCR and (optionally)
# deploys it to CapRover. Mirrors Tabayyun's release workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/suffa

jobs:
  images:
    name: build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          # Public values compiled into the PWA (anon key is protected by RLS). Empty = offline build.
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_SYNC_ENABLED=${{ vars.VITE_SYNC_ENABLED || 'true' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-caprover:
    name: deploy to CapRover
    needs: images
    runs-on: ubuntu-latest
    # Skipped until the repository variable CAPROVER_SERVER is set.
    if: ${{ vars.CAPROVER_SERVER != '' }}
    steps:
      - name: deploy web
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_WEB || 'suffa-web' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          image: ${{ env.IMAGE_PREFIX }}-web:${{ needs.images.outputs.tag }}
