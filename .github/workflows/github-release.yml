name: github release

# Publishes a versioned GitHub release for a main commit that reached staging (see
# docs/ops/releases.md). The `release` workflow calls it right after "verify staging" succeeded,
# so a release always names a version staging has verified, and it never waits for the
# production approval that follows.
#
# Version: the latest tag v<major>.<minor>.<patch> plus one patch. A merge commit with a line
# starting `[minor]` (a finished roadmap item) or `[major]` raises that part instead. Run by
# hand, the part to raise can be chosen.
on:
  workflow_call:
    inputs:
      sha:
        description: The commit staging verified
        type: string
        required: true
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  publish:
    name: publish release
    runs-on: ubuntu-latest
    # One release at a time, so two quick merges never claim the same version. A run that waits
    # here and is replaced by a newer one loses nothing: the newer release's notes list its pull
    # requests too.
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      - name: next version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          version='^v[0-9]+\.[0-9]+\.[0-9]+$'
          sha=$(git rev-parse HEAD)
          if git tag --points-at "$sha" | grep -qE "$version"; then
            echo "Commit $sha is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only plain versions count; a pre-release tag such as v2.0.0-rc1 is ignored.
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E "$version" | head -n1 || true)
          last=${last:-v1.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          message=$(git log -1 --format=%B "$sha")
          bump=${BUMP_INPUT:-patch}
          if [ -z "$BUMP_INPUT" ]; then
            if grep -q '^\[major\]' <<< "$message"; then bump=major
            elif grep -q '^\[minor\]' <<< "$message"; then bump=minor
            fi
          fi
          case "$bump" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            *) next="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Releasing $next ($bump) at $sha, after $last"
          {
            echo "skip=false"
            echo "tag=$next"
            echo "previous=$last"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: publish
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$PREVIOUS" > /dev/null; then
            notes=(--generate-notes --notes-start-tag "$PREVIOUS")
          else
            # The first release: its own merge commit only, not the whole history.
            notes=(--notes "$(git log -1 --format=%B "$SHA")")
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" "${notes[@]}"
