name: release

# Runs the CI checks, builds the suffa-web, suffa-api and suffa-backup images, smoke-tests each
# image in a real container, scans it for critical vulnerabilities (Trivy) and publishes exactly
# that image to GHCR. Nothing is pushed or deployed unless the checks, the smoke tests and the
# scan pass.
#
# Two servers (ADR-0024): every push to main goes to the staging apps (`suffa-*-stg`) and is
# verified there. Production is a separate job in the GitHub environment `production`: after the
# owner approves, it deploys the same image digests staging runs. Nothing is rebuilt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ci checks
    uses: ./.github/workflows/ci.yml

  images:
    name: build, smoke-test and publish ${{ matrix.name }}
    needs: checks
    # Only main is published and deployed, also when started by hand ("Run workflow" offers
    # every branch); on another branch the checks run and the rest is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: backup
            dockerfile: infra/docker/backup.Dockerfile
    # Real database for the api smoke test (unused by the web job).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suffa
          POSTGRES_PASSWORD: smoke0123456789abcdef
          POSTGRES_DB: suffa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suffa" --health-interval 2s --health-timeout 5s
          --health-retries 20
    steps:
      # Image names must be lowercase; the owner (e.g. "Sira-Labs") may not be.
      - name: image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/suffa" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: build image (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: smoke/suffa-${{ matrix.name }}:test
          # web: sync settings compiled into the PWA (VITE_SYNC_BACKEND=off = offline build).
          # api: version string reported by /api/version.
          build-args: |
            VITE_SYNC_BACKEND=${{ vars.VITE_SYNC_BACKEND }}
            VITE_SYNC_ENABLED=${{ vars.VITE_SYNC_ENABLED || 'true' }}
            SUFFA_VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: smoke test web
        if: matrix.name == 'web'
        run: |
          docker run -d --name web -p 8080:80 smoke/suffa-web:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz-web && break; sleep 1; done
          # The health endpoint must answer itself (not the SPA fallback) and name the image.
          curl -fsS http://127.0.0.1:8080/healthz-web | grep -q '"role":"web","version":"${{ steps.tag.outputs.tag }}"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Suffa'
          curl -fsS -o /dev/null http://127.0.0.1:8080/brand/suffa-mark.svg
          curl -fsS http://127.0.0.1:8080/some/deep/link | grep -q '<div id="root">'
      - name: smoke test api + worker
        if: matrix.name == 'api'
        env:
          DB: postgres://suffa:smoke0123456789abcdef@127.0.0.1:5432/suffa
        run: |
          SECRET=$(openssl rand -hex 32)
          run() { docker run --network host -e SUFFA_ENV=prod -e SUFFA_DATABASE_URL="$DB" -e SUFFA_AUTH_SECRET="$SECRET" -e SUFFA_PUBLIC_URL=http://127.0.0.1:8080 "$@"; }
          # A worker started before the api has migrated must exit with code 3.
          set +e; run --rm -e SUFFA_ROLE=worker smoke/suffa-api:test; code=$?; set -e
          test "$code" = 3 || { echo "expected worker exit 3, got $code"; exit 1; }
          run -d --name api smoke/suffa-api:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'
          # The job queue (pg-boss) is installed and its depth reported (ADR-0020).
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"queue":{"waiting":0'
          # Error tracking is off without a DSN, and the PWA is told so.
          curl -fsS http://127.0.0.1:8000/api/client-config | grep -q '"errorDsn":null'
          # Sync stays closed without a signed-in session.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/sync/srs_cards/pull)" = 401
          # Without SMTP the api runs, but sign-in stays off (ADR-0008) and says so in the log.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/me)" = 404
          docker logs api 2>&1 | grep -q 'auth.disabled' || { docker logs api; exit 1; }
          # With SMTP set, sign-in (Better Auth and its plugins) loads from the slim install:
          # no session is 401, not 404. Test tooling must not be in the image.
          run -d --name api-auth -e SUFFA_PORT=8001 -e SUFFA_SMTP_HOST=127.0.0.1 \
            -e SUFFA_MAIL_FROM=smoke@example.org smoke/suffa-api:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/v1/me)" = 401 \
            || { docker logs api-auth; exit 1; }
          docker logs api-auth 2>&1 | grep -q 'auth.enabled' || { docker logs api-auth; exit 1; }
          docker run --rm --entrypoint sh smoke/suffa-api:test -c \
            'for m in vitest vite esbuild rollup; do test ! -e /app/node_modules/$m || { echo "$m in image"; exit 1; }; done'
          run -d --name worker -e SUFFA_ROLE=worker smoke/suffa-api:test
          sleep 3
          docker logs worker 2>&1 | grep -q 'worker.start' || { docker logs worker; exit 1; }
          # A redeploy sends SIGTERM: the worker drains the queue and exits cleanly, well
          # before Docker's 10 s kill timeout.
          start=$(date +%s); docker stop worker >/dev/null; took=$(( $(date +%s) - start ))
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = 0 || { docker logs worker; exit 1; }
          test "$took" -lt 8 || { echo "worker took ${took}s to stop"; exit 1; }
          docker logs api | tail -5
      - name: smoke test backup (dump, verify, upload, restore)
        if: matrix.name == 'backup'
        env:
          DB: postgres://suffa:smoke0123456789abcdef@127.0.0.1:5432/suffa
        run: |
          mkdir -p /tmp/backups && chmod 777 /tmp/backups
          psql "$DB" -qc "create table smoke (id int primary key, word text); insert into smoke values (1, 'بَلَد')"
          psql "$DB" -qc "create database restore_smoke"
          run() { docker run --rm --network host -v /tmp/backups:/backups -e SUFFA_BACKUP_LOCAL_DIR=/backups "$@"; }
          run -e SUFFA_BACKUP_MODE=once -e SUFFA_BACKUP_DATABASE_URL="$DB" smoke/suffa-backup:test
          find /tmp/backups -name 'suffa-*.dump' | grep -q dump
          # Restoring into the production URL must be refused (exit 2).
          set +e; run --entrypoint /opt/suffa-backup/restore.sh -e SUFFA_BACKUP_DATABASE_URL="$DB" \
            -e SUFFA_RESTORE_DATABASE_URL="$DB" smoke/suffa-backup:test latest; code=$?; set -e
          test "$code" = 2
          run --entrypoint /opt/suffa-backup/restore.sh -e SUFFA_BACKUP_DATABASE_URL="$DB" \
            -e SUFFA_RESTORE_DATABASE_URL="${DB%/suffa}/restore_smoke" smoke/suffa-backup:test latest
          test "$(psql "${DB%/suffa}/restore_smoke" -tAc 'select word from smoke where id = 1')" = 'بَلَد'
      # Known critical vulnerabilities with a fix available stop the release before anything
      # is published; accepted exceptions (with their reason) live in .trivyignore.
      - name: scan image (Trivy, critical and fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: smoke/suffa-${{ matrix.name }}:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image that passed the smoke tests and the scan is the one published: tagged and
      # pushed, not rebuilt, so staging and production run exactly what was tested.
      - name: publish image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker tag "smoke/suffa-${{ matrix.name }}:test" "$IMAGE:$TAG"
          docker tag "smoke/suffa-${{ matrix.name }}:test" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  # Staging: the current CapRover server (ADR-0024). Deploys by digest, so the production job
  # can promote exactly these images.
  deploy-staging:
    name: deploy to staging
    needs: images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # The GitHub environment `staging`: its variables and secrets win over the repository's
    # (CAPROVER_SERVER, CAPROVER_APP_TOKEN_*, …), and deploys show up under Environments.
    environment:
      name: staging
      url: ${{ vars.SUFFA_STAGING_URL || 'https://suffa.siralabs.org' }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
      # Handed on: the production job cannot read the staging environment's variables.
      server: ${{ vars.CAPROVER_SERVER }}
      url: ${{ vars.SUFFA_STAGING_URL || 'https://suffa.siralabs.org' }}
      api: ${{ steps.digests.outputs.api }}
      web: ${{ steps.digests.outputs.web }}
      backup: ${{ steps.digests.outputs.backup }}
    steps:
      # Image names must be lowercase; the owner (e.g. "Sira-Labs") may not be.
      - name: image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/suffa" >> "$GITHUB_ENV"
      # New packages in an organization start private: read them with the workflow's token.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The published tag is resolved to its digest once; staging and production use the digest.
      - name: image digests
        id: digests
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          for name in api web backup; do
            digest=$(docker buildx imagetools inspect "$IMAGE_PREFIX-$name:$TAG" --format '{{.Manifest.Digest}}')
            case "$digest" in sha256:*) ;; *) echo "::error::no digest for $name:$TAG"; exit 1 ;; esac
            echo "$name=$IMAGE_PREFIX-$name@$digest" >> "$GITHUB_OUTPUT"
            echo "$name: $IMAGE_PREFIX-$name@$digest"
          done
      # All four apps or none: production is only offered a release that staging ran in full.
      - name: staging is set up
        id: gate
        env:
          SERVER: ${{ vars.CAPROVER_SERVER }}
          API: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          WORKER: ${{ secrets.CAPROVER_APP_TOKEN_WORKER }}
          BACKUP: ${{ secrets.CAPROVER_APP_TOKEN_BACKUP }}
          WEB: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
        run: |
          count=0
          for token in "$API" "$WORKER" "$BACKUP" "$WEB"; do [ -n "$token" ] && count=$((count + 1)); done
          if [ -z "$SERVER" ] || [ "$count" -eq 0 ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging is not set up (CAPROVER_SERVER or the app tokens missing); skipping the staging deploy"
          elif [ "$count" -eq 4 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Staging is partly configured: set all four CAPROVER_APP_TOKEN_API/_WORKER/_BACKUP/_WEB, or none"
            exit 1
          fi
      # Order matters: the api migrates the schema; the worker waits for it (exit code 3).
      - name: deploy api
        if: steps.gate.outputs.deployed == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_API || 'suffa-api' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          image: ${{ steps.digests.outputs.api }}
      - name: deploy worker
        if: steps.gate.outputs.deployed == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_WORKER || 'suffa-worker' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_WORKER }}
          image: ${{ steps.digests.outputs.api }}
      - name: deploy backup
        if: steps.gate.outputs.deployed == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_BACKUP || 'suffa-backup' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_BACKUP }}
          image: ${{ steps.digests.outputs.backup }}
      - name: deploy web
        if: steps.gate.outputs.deployed == 'true'
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_WEB || 'suffa-web' }}
          token: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          image: ${{ steps.digests.outputs.web }}

  # Staging must run the new images before production can be offered them.
  verify-staging:
    name: verify staging
    needs: [images, deploy-staging]
    runs-on: ubuntu-latest
    if: needs.deploy-staging.outputs.deployed == 'true'
    timeout-minutes: 12
    steps:
      - name: staging reports the new version
        env:
          URL: ${{ needs.deploy-staging.outputs.url }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          for i in $(seq 1 60); do
            api=$(curl -fsS "$URL/healthz" || true)
            web=$(curl -fsS "$URL/healthz-web" || true)
            if echo "$api" | grep -q "\"version\":\"$TAG\"" && echo "$api" | grep -q '"status":"ok"' \
              && echo "$web" | grep -q "\"version\":\"$TAG\""; then
              echo "staging runs $TAG"; exit 0
            fi
            sleep 10
          done
          echo "::error::staging did not report $TAG within 10 minutes"; echo "$api"; echo "$web"; exit 1

  # Production: its own server (ADR-0024). Waits for the owner's approval (required reviewer on
  # the GitHub environment `production`), then deploys the digests staging runs
  # (deploy-production.yml). Rolling back: rollback-production.yml.
  deploy-production:
    name: promote to production
    needs: [images, deploy-staging, verify-staging]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      tag: ${{ needs.images.outputs.tag }}
      api: ${{ needs.deploy-staging.outputs.api }}
      web: ${{ needs.deploy-staging.outputs.web }}
      backup: ${{ needs.deploy-staging.outputs.backup }}
      require-staging: true
      staging-server: ${{ needs.deploy-staging.outputs.server }}
      staging-url: ${{ needs.deploy-staging.outputs.url }}
    secrets: inherit
