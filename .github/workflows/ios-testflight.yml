# Builds the iOS app and uploads it to TestFlight (ADR-0019, mobile/README.md).
#
# Manual: Actions → ios-testflight → Run workflow (main only). The web build inside the app
# talks to `api_origin`. Signing is automatic ("cloud signing") with an App Store Connect API
# key, so no certificates or provisioning profiles live in the repository or in secrets:
#
#   APP_STORE_CONNECT_KEY_ID      key id of the API key (App Store Connect → Users and Access
#                                 → Integrations → App Store Connect API, role "Admin")
#   APP_STORE_CONNECT_ISSUER_ID   issuer id shown on the same page
#   APP_STORE_CONNECT_KEY_P8      contents of the downloaded AuthKey_<id>.p8 file
#   APPLE_TEAM_ID                 team id (Membership details), e.g. AB12CD34EF
#
# Version: the latest release tag (v1.3.3 → 1.3.3); build number: this workflow's run number.
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Server the app talks to
        required: true
        default: https://suffa.siralabs.org

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Secrets never reach builds of other branches or forks.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: check secrets
        run: |
          missing=0
          for name in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::secret for $name is not set"; missing=1; fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: version
        id: version
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "marketing=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "App ${tag#v} (${GITHUB_RUN_NUMBER}) for ${{ inputs.api_origin }}" >> "$GITHUB_STEP_SUMMARY"

      - name: web build for the app
        env:
          VITE_SUFFA_API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          npm ci --no-audit --no-fund
          npm run build -w @suffa/web

      - name: copy into the iOS project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Suffa.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"

      - name: upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Suffa.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded; TestFlight shows the build after Apple's processing (about 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
