# Suffa — CapRover one-click template: full stack (db, api, worker, web).
#
# Use: CapRover → Apps → One-Click Apps/Databases → ">> TEMPLATE <<" → paste this file →
#      app name "suffa" → Deploy.
# Creates: suffa-db, suffa-api, suffa-worker, suffa-web. Reuses your existing RustFS app.
# Images are built by .github/workflows/release.yml and published publicly on GHCR.
# Runbook: docs/ops/caprover-deployment.md
captainVersion: 4
services:
  $$cap_appname-db:
    image: pgvector/pgvector:$$cap_pg_tag
    restart: always
    volumes:
      - $$cap_appname-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: suffa
      POSTGRES_DB: suffa
      POSTGRES_PASSWORD: $$cap_db_password
    caproverExtra:
      notExposeAsWebApp: 'true'

  # Runs DB migrations on start, then serves /healthz and /api/* on port 8000.
  $$cap_appname-api:
    image: ghcr.io/thedatadudech/suffa-api:$$cap_tag
    restart: always
    depends_on:
      - $$cap_appname-db
    environment:
      SUFFA_ENV: prod
      SUFFA_PUBLIC_URL: https://$$cap_domain
      SUFFA_DATABASE_URL: postgres://suffa:$$cap_db_password@srv-captain--$$cap_appname-db:5432/suffa
      SUFFA_AUTH_SECRET: $$cap_auth_secret
      SUFFA_ENCRYPTION_KEY: $$cap_encryption_key
      SUFFA_S3_ENDPOINT: http://srv-captain--$$cap_rustfs_app:9000
      SUFFA_S3_ALLOW_HTTP: 'true'
      SUFFA_S3_BUCKET_MEDIA: suffa-media
      SUFFA_S3_BUCKET_UPLOADS: suffa-uploads
      SUFFA_S3_BUCKET_CONTENT: suffa-content
    caproverExtra:
      containerHttpPort: '8000'
      notExposeAsWebApp: 'true'

  # Same image in worker mode. Exits with code 3 until the api has migrated; CapRover restarts it.
  $$cap_appname-worker:
    image: ghcr.io/thedatadudech/suffa-api:$$cap_tag
    restart: always
    depends_on:
      - $$cap_appname-api
    environment:
      SUFFA_ROLE: worker
      SUFFA_ENV: prod
      SUFFA_DATABASE_URL: postgres://suffa:$$cap_db_password@srv-captain--$$cap_appname-db:5432/suffa
      SUFFA_AUTH_SECRET: $$cap_auth_secret
      SUFFA_ENCRYPTION_KEY: $$cap_encryption_key
      SUFFA_S3_ENDPOINT: http://srv-captain--$$cap_rustfs_app:9000
      SUFFA_S3_ALLOW_HTTP: 'true'
      SUFFA_S3_BUCKET_MEDIA: suffa-media
      SUFFA_S3_BUCKET_UPLOADS: suffa-uploads
      SUFFA_S3_BUCKET_CONTENT: suffa-content
    caproverExtra:
      notExposeAsWebApp: 'true'

  $$cap_appname-web:
    image: ghcr.io/thedatadudech/suffa-web:$$cap_tag
    restart: always
    depends_on:
      - $$cap_appname-api
    environment:
      SUFFA_API_UPSTREAM: srv-captain--$$cap_appname-api:8000
      SUFFA_MEDIA_UPSTREAM: srv-captain--$$cap_rustfs_app:9000
    caproverExtra:
      containerHttpPort: '80'

caproverOneClickApp:
  variables:
    - id: $$cap_domain
      label: Public domain
      defaultValue: suffa.example.com
      description: The domain you will connect to the web app (used for links in emails).
      validRegex: /^[a-z0-9.-]+$/
    - id: $$cap_tag
      label: Image tag
      defaultValue: latest
      description: latest follows main. For production use an immutable sha-<short> tag; CI redeploys with those.
      validRegex: /^[A-Za-z0-9._-]+$/
    - id: $$cap_pg_tag
      label: pgvector/Postgres image tag
      defaultValue: pg17
      description: Postgres 17 with pgvector. For production pin a release tag such as 0.8.0-pg17 and upgrade deliberately after a pg_dump.
      validRegex: /^[A-Za-z0-9._-]+$/
    - id: $$cap_db_password
      label: Database password
      defaultValue: $$cap_gen_random_hex(24)
      description: Generated. Hex is safe inside a database URL.
      validRegex: /^[A-Za-z0-9]{16,}$/
    - id: $$cap_auth_secret
      label: Auth secret
      defaultValue: $$cap_gen_random_hex(48)
      description: Generated. The api refuses to start in prod with a short or placeholder secret.
      validRegex: /^[A-Za-z0-9]{32,}$/
    - id: $$cap_encryption_key
      label: Encryption key
      defaultValue: $$cap_gen_random_hex(64)
      description: Generated (32 bytes as hex). Encrypts Google Drive tokens later.
      validRegex: /^[a-f0-9]{64}$/
    - id: $$cap_rustfs_app
      label: Existing RustFS app name
      defaultValue: rustfs
      description: The shared RustFS app (also used by Tabayyun). Storage keys are added when recordings ship.
      validRegex: /^[a-z0-9-]+$/
  instructions:
    start: >-
      Deploys the full Suffa stack in the same layout as Tabayyun: Postgres 17 + pgvector,
      the api, the worker (same image) and the web app (Caddy + PWA). Use the app name
      "suffa" so the apps are called suffa-db, suffa-api, suffa-worker and suffa-web.
    end: >-
      Done. Next: (1) $$cap_appname-web → HTTP Settings → connect $$cap_domain, Enable HTTPS,
      Force HTTPS. (2) Check https://$$cap_domain/healthz → "status":"ok". The worker may
      restart once while the api migrates the database; that is expected. (3) For automatic
      deploys, enable App Tokens on api, worker and web, store them as GitHub secrets
      CAPROVER_APP_TOKEN_API / _WORKER / _WEB and set the variable
      CAPROVER_SERVER=https://captain.<root-domain>.
  displayName: Suffa (full stack)
  isOfficial: false
  description: Offline-first Arabic learning platform (الصُّفَّة) — database, api, worker and web.
  documentation: https://github.com/thedatadudech/suffa/blob/main/docs/ops/caprover-deployment.md
